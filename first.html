    <h1>Age Eligibility  for Navratri</h1>

    
</body>
<script>
    
let userInput = prompt("Enter your birth date (YYYY-MM-DD):");

        
        let birthDate = new Date(userInput);

        
        let cutoffDate = new Date("2026-10-19");

        
        if (isNaN(birthDate.getTime())) {
            alert("Invalid date format entered. Please use YYYY-MM-DD.");
        } else {
            
            let result = (birthDate < cutoffDate)
                ? "You are eligible to come to Navratri!"
                : "You are not eligible to come to Navratri.";
            alert(result);
            console.log(userInput);
        document.write(result);
        }





</script>
